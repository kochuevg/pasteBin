# --- Server Configuration ---
server.port=8080

# --- File Upload Limits (10MB) ---
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# --- Database (PostgreSQL) ---
spring.datasource.url=jdbc:postgresql://localhost:5432/pastebin_db
spring.datasource.username=postgres
spring.datasource.password=password

# --- S3 Storage Configuration ---
# If using Cloudflare R2, the endpoint looks like: https://<ACCOUNT_ID>.r2.cloudflarestorage.com
# If using MinIO (Local), use: http://localhost:9000
aws.s3.endpoint=${S3_ENDPOINT}
aws.s3.region=auto
aws.s3.bucket=my-pastebin-bucket

# --- S3 Credentials (NEVER commit these to Git!) ---
aws.access.key=${S3_ACCESS_KEY}
aws.secret.key=${S3_SECRET_KEY}

# --- JWT Token Info (NEVER commit these to Git!) ---
jwt.secret-key=${JWT_SECRET_KEY}
jwt.expiration = ${JWT_EXPIRATION_TIME}