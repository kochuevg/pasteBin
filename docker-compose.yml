services:
  api:
    build: .
    image: my-pastebin-api
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/${DB_NAME}
      - S3_ENDPOINT_LOCAL=${S3_ENDPOINT_LOCAL}
    depends_on:
      - db
      - minio-setup

  db:
    image: postgres:15-alpine
    ports:
      - "5433:5432"
    env_file:
      - .env
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio
    ports:
      - "9000:9000"
      - "9001:9001"
    env_file:
      - .env
    environment:
      - MINIO_ROOT_USER=${S3_ACCESS_KEY}
      - MINIO_ROOT_PASSWORD=${S3_SECRET_KEY}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  minio-setup:
    image: minio/mc
    env_file:
      - .env
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set myminio http://minio:9000 ${S3_ACCESS_KEY} ${S3_SECRET_KEY};
      mc mb myminio/my-pastebin-bucket || true;
      mc anonymous set public myminio/my-pastebin-bucket || true;
      "

  redis:
    image: redis:latest
    container_name: pastebin-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    command: redis-server --maxmemory 100mb --maxmemory-policy allkeys-lfu

volumes:
  postgres_data:
  minio_data: